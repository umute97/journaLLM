name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    name: Label by area
    # Fork and Dependabot PRs get a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Only add labels: `ci` and `documentation` are shared with the PR-title labels,
          # so removing non-matching ones would fight with that workflow.
          sync-labels: false
