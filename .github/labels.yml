# Source of truth for repository labels, synced by .github/workflows/labels-sync.yml.
# Labels not listed here are deleted on sync. `aliases` rename existing labels in place.

# Kind of change: set automatically from the Conventional Commit PR title
- name: "feature"
  color: "1d76db"
  description: New feature
  aliases: ["type:feat", "enhancement"]
- name: "bug"
  color: "d73a4a"
  description: Bug fix
  aliases: ["type:fix"]
- name: "performance"
  color: "5319e7"
  description: Performance improvement
  aliases: ["type:perf"]
- name: "refactor"
  color: "c5def5"
  description: Code change that neither fixes a bug nor adds a feature
  aliases: ["type:refactor"]
- name: "test"
  color: "bfd4f2"
  description: Tests
  aliases: ["type:test"]
- name: "build"
  color: "fef2c0"
  description: Build system or packaging
  aliases: ["type:build"]
- name: "chore"
  color: "ededed"
  description: Maintenance
  aliases: ["type:chore"]
- name: "revert"
  color: "ededed"
  description: Reverts a previous change
  aliases: ["type:revert"]
- name: "breaking"
  color: "b60205"
  description: Breaking change (bumps the minor version while < 1.0)

# Shared: set from the PR title and/or the changed paths
- name: "documentation"
  color: "0075ca"
  description: Documentation
  aliases: ["type:docs", "area:docs"]
- name: "ci"
  color: "fef2c0"
  description: GitHub workflows and repo automation
  aliases: ["type:ci", "area:ci"]

# Area: set automatically from changed paths (.github/labeler.yml)
- name: "api"
  color: "0e8a16"
  description: OpenAPI contract
  aliases: ["area:api"]
- name: "backend"
  color: "0e8a16"
  description: Python backend
  aliases: ["area:backend"]
- name: "web"
  color: "0e8a16"
  description: Vue web app
  aliases: ["area:web"]
- name: "cli"
  color: "0e8a16"
  description: Command-line client
  aliases: ["area:cli"]
- name: "infra"
  color: "0e8a16"
  description: Docker, compose, scripts
  aliases: ["area:infra"]

# Status / misc
- name: "blocked"
  color: "e99695"
  description: Waiting on something else
  aliases: ["status:blocked"]
- name: "needs-review"
  color: "fbca04"
  description: Needs a closer review before moving on
  aliases: ["status:needs-review"]
- name: "deps"
  color: "0366d6"
  description: Dependency update
  aliases: ["dependencies"]

# Managed by release-please
- name: "autorelease: pending"
  color: "ededed"
  description: Release PR not yet released
- name: "autorelease: tagged"
  color: "ededed"
  description: Release PR has been tagged
