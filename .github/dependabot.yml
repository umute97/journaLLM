version: 2

# Add an entry per ecosystem as components land (uv: /backend, /cli; npm: /web; docker: Dockerfiles).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["deps", "chore", "ci"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: ["deps", "chore", "infra"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      api-tools:
        patterns: ["*"]
    labels: ["deps", "chore", "api"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: ["deps", "chore", "backend"]
    commit-message:
      prefix: chore
      include: scope
