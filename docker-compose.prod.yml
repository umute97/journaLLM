# Runs the released images from GHCR: `docker compose -f docker-compose.prod.yml up -d`.
# Needs POSTGRES_PASSWORD and API_TOKEN (in the environment or a `.env` next to this file).
name: kritzellm

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kritzellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kritzellm}
    volumes:
      # Postgres 18+ images keep data under a versioned subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Brings the schema up to date, then exits. api waits for it.
  migrate:
    image: ghcr.io/umute97/kritzellm-api:${KRITZELLM_VERSION:-latest}
    command: ["python", "-m", "kritzellm.db.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kritzellm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kritzellm}

  api:
    image: ghcr.io/umute97/kritzellm-api:${KRITZELLM_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kritzellm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kritzellm}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      DATA_DIR: /data
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api-data:/data

volumes:
  db-data:
  api-data:
